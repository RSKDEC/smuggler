<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".6" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#f08a00"/>
    </radialGradient>
    <pattern id="stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="44" fill="rgba(255,255,255,.10)"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#stripes)"/>
  <g id="art" transform="rotate(-6 256 300)" stroke-linejoin="round">
    <!-- shadow -->
    <ellipse cx="262" cy="468" rx="150" ry="16" fill="rgba(80,40,0,.28)" stroke="none"/>
    <!-- luggage tag -->
    <path d="M132 236 Q86 250 84 300" fill="none" stroke="#2a1d14" stroke-width="8"/>
    <g transform="rotate(14 82 340)">
      <rect x="44" y="296" width="76" height="104" rx="12" fill="#f4ead8" stroke="#2a1d14" stroke-width="10"/>
      <circle cx="82" cy="318" r="8" fill="#2a1d14"/>
      <rect x="60" y="344" width="44" height="8" rx="4" fill="#e63946"/>
      <rect x="60" y="362" width="32" height="8" rx="4" fill="#c9b79a"/>
    </g>
    <!-- wheels -->
    <circle cx="176" cy="440" r="22" fill="#2a1d14"/>
    <circle cx="336" cy="440" r="22" fill="#2a1d14"/>
    <!-- body -->
    <rect x="116" y="172" width="280" height="256" rx="46" fill="#e63946" stroke="#2a1d14" stroke-width="14"/>
    <rect x="160" y="179" width="24" height="242" fill="rgba(0,0,0,.14)"/>
    <rect x="328" y="179" width="24" height="242" fill="rgba(0,0,0,.14)"/>
    <rect x="136" y="190" width="240" height="18" rx="9" fill="rgba(255,255,255,.28)"/>
    <!-- fedora -->
    <ellipse cx="256" cy="180" rx="156" ry="24" fill="#3d2c22" stroke="#2a1d14" stroke-width="12"/>
    <path d="M172 176 Q176 86 256 90 Q336 86 340 176 Z" fill="#3d2c22" stroke="#2a1d14" stroke-width="12"/>
    <path d="M214 98 Q256 120 298 98" fill="none" stroke="#2a1d14" stroke-width="8" opacity=".5"/>
    <rect x="176" y="140" width="160" height="22" fill="#ffb703"/>
    <!-- shades -->
    <rect x="160" y="250" width="86" height="54" rx="18" fill="#1a120c"/>
    <rect x="266" y="250" width="86" height="54" rx="18" fill="#1a120c"/>
    <rect x="240" y="262" width="32" height="11" fill="#1a120c"/>
    <path d="M178 266 l22 0 M284 266 l22 0" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <!-- smirk -->
    <path d="M212 356 Q262 384 304 344" fill="none" stroke="#2a1d14" stroke-width="14" stroke-linecap="round"/>
  </g>
